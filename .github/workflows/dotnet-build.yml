name: .NET Build & Test

on:
  - push
  - pull_request

jobs:
  build:
    name: build & test (${{ matrix.project }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - Beans.Patchable

    steps:
      - name: 📩 checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔎 check for changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "No usable diff base (new branch or force-push) - treating as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$base" -- "src/${{ matrix.project }}/" "src/global.json"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ⚙️ setup .NET
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: src/${{ matrix.project }}/**/*.csproj

      - name: 📦 restore
        if: steps.changes.outputs.changed == 'true'
        run: dotnet restore src/${{ matrix.project }}/${{ matrix.project }}.sln

      - name: 🔨 build
        if: steps.changes.outputs.changed == 'true'
        run: dotnet build src/${{ matrix.project }}/${{ matrix.project }}.sln --no-restore --configuration Release

      - name: 🧪 test
        if: steps.changes.outputs.changed == 'true'
        working-directory: src/${{ matrix.project }}
        run: dotnet test --no-build --configuration Release
