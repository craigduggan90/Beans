name: Release

on:
  push:
    branches:
      - main
  # manually (re)publish an existing release tag to nuget
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to publish to nuget (e.g. Beans.Pageable-v1.0.0)
        required: true
        type: string

# one release run at a time, and never cancel one part-way through
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      # per-project outputs are keyed by path (e.g. src/Beans.Patchable--tag_name), so pass them all through
      all: ${{ toJSON(steps.release.outputs) }}

    steps:
      # on a merged release PR this tags + creates the GitHub releases,
      # otherwise it opens/updates one release PR per project (version + changelog), for a human to merge.
      # a PAT is needed so the release PRs trigger the required status checks.
      - name: 🔖 release please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    name: publish (${{ matrix.path }})
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.release-please.outputs.paths_released) }}

    env:
      TAG: ${{ fromJson(needs.release-please.outputs.all)[format('{0}--tag_name', matrix.path)] }}

    steps:
      - name: 📩 checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: ⚙️ setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # the version comes from the csproj that release-please just bumped
      - name: 📦 pack
        run: |
          project=$(basename "${{ matrix.path }}")
          dotnet pack "${{ matrix.path }}/$project.sln" --configuration Release --output artifacts

      - name: 📎 attach to github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" artifacts/*.nupkg --clobber

      - name: 🔑 nuget login
        id: nuget-login
        if: vars.NUGET_PUBLISH_ENABLED == 'true'
        uses: NuGet/login@v1
        with:
          user: BillYinzen

      - name: 🚀 push to nuget
        if: vars.NUGET_PUBLISH_ENABLED == 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  # for releases that were tagged without being pushed to nuget, or whose publish failed
  republish:
    name: republish (${{ inputs.tag }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      TAG: ${{ inputs.tag }}

    steps:
      - name: 📩 checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: ⚙️ setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # tags look like Beans.Pageable-v1.0.0, and the project lives in src/Beans.Pageable
      - name: 📦 pack
        run: |
          project="${TAG%-v*}"
          if [ ! -f "src/$project/$project.sln" ]; then
            echo "::error::tag '$TAG' does not map to a project under src/"
            exit 1
          fi
          dotnet pack "src/$project/$project.sln" --configuration Release --output artifacts

      - name: 🔑 nuget login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: BillYinzen

      - name: 🚀 push to nuget
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
